services:
  - type: web
    name: fieldnote
    plan: free
    runtime: python
    rootDir: outputs/FormGuide
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: TINKER_API_KEY
        sync: false
      - key: TINKER_MODEL_NAME
        value: thinkingmachines/Inkling-Small
      - key: PYTHON_VERSION
        value: 3.12.11
